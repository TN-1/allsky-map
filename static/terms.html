<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Terms of Service &amp; Privacy Policy - AllSky Map</title>
		<link rel="shortcut icon" type="image/x-icon" href="images/favicon_128.png" />
		
		<link href="vendor/daisyui.css" rel="stylesheet" type="text/css" />
		<script src="vendor/tailwindcss-browser.js"></script>
		<script src="vendor/marked.min.js"></script>
		
		<script>
			// Synchronize theme with user's saved preference
			const savedTheme = localStorage.getItem('theme') || 'dark';
			document.documentElement.setAttribute('data-theme', savedTheme);
		</script>
		<style>
			/* Scoped Markdown Typography Styles (overriding Tailwind Preflight resets) */
			#content h1 {
				font-size: 1.85rem;
				font-weight: 800;
				margin-top: 1.25rem;
				margin-bottom: 1.25rem;
				line-height: 1.3;
				border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
				padding-bottom: 0.5rem;
			}
			#content h2 {
				font-size: 1.35rem;
				font-weight: 700;
				margin-top: 2rem;
				margin-bottom: 0.75rem;
				line-height: 1.35;
				border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
				padding-bottom: 0.35rem;
			}
			#content h3 {
				font-size: 1.15rem;
				font-weight: 700;
				margin-top: 1.5rem;
				margin-bottom: 0.5rem;
				line-height: 1.4;
			}
			#content h4 {
				font-size: 1rem;
				font-weight: 600;
				margin-top: 1rem;
				margin-bottom: 0.25rem;
			}
			#content p {
				margin-top: 0.85rem;
				margin-bottom: 0.85rem;
				line-height: 1.7;
				color: color-mix(in srgb, currentColor 90%, transparent);
			}
			#content ul {
				margin-top: 0.75rem;
				margin-bottom: 0.75rem;
				padding-left: 1.5rem;
				list-style-type: disc;
			}
			#content ol {
				margin-top: 0.75rem;
				margin-bottom: 0.75rem;
				padding-left: 1.5rem;
				list-style-type: decimal;
			}
			#content li {
				margin-top: 0.35rem;
				margin-bottom: 0.35rem;
				line-height: 1.6;
			}
			#content strong {
				font-weight: 700;
			}
			#content a {
				color: var(--color-primary, #3b82f6);
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			#content a:hover {
				opacity: 0.8;
			}
			#content hr {
				margin-top: 2rem;
				margin-bottom: 2rem;
				border: 0;
				border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
			}
			#content blockquote {
				margin: 1.25rem 0;
				padding: 0.75rem 1.25rem;
				border-left: 4px solid var(--color-primary, #3b82f6);
				background: color-mix(in srgb, currentColor 5%, transparent);
				border-radius: 0 0.5rem 0.5rem 0;
			}
			#content code {
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 0.85em;
				padding: 0.15rem 0.35rem;
				border-radius: 0.25rem;
				background: color-mix(in srgb, currentColor 12%, transparent);
				color: var(--color-primary, #3b82f6);
			}
			#content pre code {
				padding: 0;
				background: transparent;
				color: inherit;
			}
			#content pre {
				margin: 1rem 0;
				padding: 1rem;
				border-radius: 0.5rem;
				background: color-mix(in srgb, currentColor 8%, transparent);
				overflow-x: auto;
			}
		</style>
	</head>
	<body class="bg-base-100 text-base-content font-sans min-h-screen py-8 px-4 sm:px-6 lg:px-8">
		<div class="max-w-4xl mx-auto space-y-6">
			
			<!-- Navigation / Header -->
			<div class="flex items-center justify-between bg-base-200 border border-base-300 rounded-2xl px-6 py-4 shadow-lg">
				<div class="flex items-center gap-3">
					<img src="images/logo.png" alt="Allsky Map Logo" class="w-10 h-10 object-contain rounded-xl" />
					<div>
						<h1 class="text-base font-bold leading-tight">AllSky Map</h1>
						<p class="text-xs text-base-content/70">Terms of Service &amp; Privacy Policy</p>
					</div>
				</div>
				<a href="index.html" class="btn btn-sm btn-outline gap-2 font-semibold">
					<svg class="w-4 h-4 fill-none stroke-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M19 12H5M12 19l-7-7 7-7"/>
					</svg>
					Back to Map
				</a>
			</div>

			<!-- Dynamic Content Container -->
			<div class="bg-base-200 border border-base-300 shadow-xl rounded-2xl p-6 sm:p-10">
				<article id="content" class="prose max-w-none text-base-content">
					<!-- Initial loading indicator -->
					<div class="flex items-center justify-center py-12 gap-3 text-base-content/70">
						<span class="loading loading-spinner loading-md"></span>
						<span class="text-sm">Loading terms and policies...</span>
					</div>
				</article>

				<!-- Footer within card -->
				<div class="border-t border-base-300 mt-10 pt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-base-content/60">
					<p>© 2026 Hamish West (@TN-1). Licensed under AGPLv3.</p>
					<a href="index.html" class="btn btn-sm btn-ghost gap-1.5 font-semibold text-base-content/80">
						<span>Back to Map</span>
						<svg class="w-3.5 h-3.5 fill-none stroke-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M5 12h14M12 5l7 7-7 7"/>
						</svg>
					</a>
				</div>
			</div>

		</div>

		<script>
			// Fetch and render terms.md dynamically
			fetch('terms.md')
				.then(response => {
					if (!response.ok) {
						throw new Error(`HTTP error! status: ${response.status}`);
					}
					return response.text();
				})
				.then(markdown => {
					const container = document.getElementById('content');
					container.innerHTML = marked.parse(markdown);
				})
				.catch(err => {
					console.error('Failed to load terms.md:', err);
					document.getElementById('content').innerHTML = `
						<div class="alert alert-error">
							<span>Failed to load Terms of Service. You may review the raw document directly at <a href="terms.md" class="underline font-bold">terms.md</a>.</span>
						</div>
					`;
				});
		</script>
	</body>
</html>
