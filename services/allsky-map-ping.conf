# ==============================================================================
# Configuration file for the Indi-Allsky Map Ping Client Service
# Place this file at: /etc/allsky-map/ping.conf
# Make sure permissions are secure, e.g., chmod 600 /etc/allsky-map/ping.conf
# ==============================================================================

# The endpoint of the Allsky Map server API ping endpoint.
# Replace with the actual URL of your central Allsky Map server.
# Example: https://map.indi-allsky.org/api/ping
API_URL="http://localhost:8000/api/ping"

# The unique API Key generated via the server UI or `/api/register`.
# MUST be a valid UUID. Keep this secret!
API_KEY="your-uuid-api-key-here"

# --- Camera Metadata ---

# The name of your Allsky Camera (required).
CAMERA_NAME="My Allsky Camera"

# The owner's name/handle (optional, but recommended).
CAMERA_OWNER="John Doe"

# Geographical coordinates of the camera site (optional).
# Note: For privacy, the central server fuzzes these to 2 decimal places.
CAMERA_LAT="12.3456"
CAMERA_LNG="56.7890"

# URL of your camera's website or portal (optional).
CAMERA_SITE_URL="https://my-camera-website.com"

# URL of the current allsky image (optional).
# The central server fetches or proxies this to display a live thumbnail.
# Set this if your camera has a publicly accessible HTTP URL for its current image.
CAMERA_IMAGE_URL="https://my-camera-website.com/current.jpg"

# Path to the local camera image file on disk (optional).
# If specified, the script reads this local file, base64-encodes it,
# and uploads it directly in the ping request. This is the recommended
# way to send images as it avoids SSRF issues and works behind NAT.
# Example: CAMERA_IMAGE_PATH="/home/allsky/allsky/images/current.jpg"
CAMERA_IMAGE_PATH=""
